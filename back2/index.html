<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Offer</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }

  .box {
    max-width: 420px;
    width: 100%;
  }

  .urgent {
    color: #d9000d;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #111;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  p {
    font-size: 14px;
    color: #555;
    margin-bottom: 20px;
  }

  .price {
    font-size: 56px;
    font-weight: 800;
    color: #111;
    margin-bottom: 20px;
  }

  .price sup {
    font-size: 22px;
  }

  .cta {
    display: block;
    width: 100%;
    padding: 20px;
    background: #16a34a;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(22,163,74,0.5);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%,100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.05);
    }
  }

  .cta:active {
    transform: scale(0.96);
  }

  .small {
    margin-top: 10px;
    font-size: 12px;
    color: #999;
  }
</style>

</head>

<body>

<div class="box">

  <div class="urgent">⚠️ FINAL CHANCE</div>

  <h1>
    Wait… This is your
    <span style="color:#d9000d;">LAST OFFER</span>
  </h1>

  <p>
    This page will disappear. Unlock the full experience now for an unbeatable price.
  </p>

<a
href="https://www.checkout-ds24.com/product/680704?voucher=back2"
class="cta"
id="checkout-button"

>


YES — GET ACCESS NOW →


  </a>

  <div class="small">
    Instant access • Secure checkout • 60-day guarantee
  </div>

</div>

<script>
(function () {

  /*
   * ============================================================
   * RASTREAMENTO COMPLETO
   * ============================================================
   *
   * Esta página:
   *
   * 1. Lê os parâmetros atuais da URL.
   * 2. Recupera parâmetros salvos anteriormente.
   * 3. Junta tudo.
   * 4. Salva novamente no localStorage.
   * 5. Salva novamente em cookie.
   * 6. Monta o checkout preservando os parâmetros.
   *
   * Assim, mesmo que o usuário chegue aqui pelo backredirect,
   * o identificador original da campanha continua disponível.
   */

  const STORAGE_KEY = 'campaign_tracking_data_v1';
  const COOKIE_NAME = 'campaign_tracking_data_v1';

  /*
   * Parâmetros importantes conhecidos.
   *
   * Além deles, o script também salva QUALQUER parâmetro
   * adicional encontrado na URL.
   */

  const IMPORTANT_PARAMS = [
    'utm_source',
    'utm_medium',
    'utm_campaign',
    'utm_content',
    'utm_term',

    'fbclid',
    'gclid',
    'gbraid',
    'wbraid',

    'ttclid',
    'msclkid',
    'twclid',
    'dclid',

    'li_fat_id',
    'li_click_id',

    'sccid',
    'epik',

    'campaign_id',
    'ad_id',
    'adset_id',
    'placement',
    'creative_id'
  ];


  /*
   * ------------------------------------------------------------
   * LER LOCALSTORAGE
   * ------------------------------------------------------------
   */

  function getStoredData() {

    try {

      const data = localStorage.getItem(STORAGE_KEY);

      if (!data) {
        return {};
      }

      return JSON.parse(data) || {};

    } catch (error) {

      console.log('Erro ao ler localStorage:', error);

      return {};
    }
  }


  /*
   * ------------------------------------------------------------
   * SALVAR LOCALSTORAGE
   * ------------------------------------------------------------
   */

  function saveStoredData(data) {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    } catch (error) {

      console.log('Erro ao salvar localStorage:', error);
    }
  }


  /*
   * ------------------------------------------------------------
   * LER COOKIE
   * ------------------------------------------------------------
   */

  function getCookieData() {

    try {

      const cookies = document.cookie.split(';');

      for (let cookie of cookies) {

        cookie = cookie.trim();

        if (cookie.indexOf(COOKIE_NAME + '=') === 0) {

          const value = cookie.substring(
            (COOKIE_NAME + '=').length
          );

          return JSON.parse(
            decodeURIComponent(value)
          ) || {};
        }
      }

    } catch (error) {

      console.log('Erro ao ler cookie:', error);
    }

    return {};
  }


  /*
   * ------------------------------------------------------------
   * SALVAR COOKIE
   * ------------------------------------------------------------
   */

  function saveCookieData(data) {

    try {

      const encoded = encodeURIComponent(
        JSON.stringify(data)
      );

      /*
       * Cookie válido por 90 dias.
       */

      document.cookie =
        COOKIE_NAME +
        '=' +
        encoded +
        '; max-age=' +
        (90 * 24 * 60 * 60) +
        '; path=/; SameSite=Lax';

    } catch (error) {

      console.log('Erro ao salvar cookie:', error);
    }
  }


  /*
   * ------------------------------------------------------------
   * LER URL ATUAL
   * ------------------------------------------------------------
   *
   * Aqui pegamos TODOS os parâmetros presentes na URL.
   *
   * Não dependemos apenas de UTM.
   */

  function getCurrentUrlParams() {

    const params = new URLSearchParams(
      window.location.search
    );

    const data = {};

    params.forEach(function (value, key) {

      if (value !== '') {

        data[key] = value;
      }

    });

    return data;
  }


  /*
   * ------------------------------------------------------------
   * RECUPERAR DADOS
   * ------------------------------------------------------------
   */

  const currentParams = getCurrentUrlParams();

  const storedParams = getStoredData();

  const cookieParams = getCookieData();


  /*
   * ------------------------------------------------------------
   * MESCLAR DADOS
   * ------------------------------------------------------------
   *
   * Prioridade:
   *
   * URL atual
   * ↓
   * localStorage
   * ↓
   * cookie
   *
   * Se o parâmetro chegou novamente pela URL,
   * ele passa a ser o valor principal.
   */

  const trackingData = {
    ...cookieParams,
    ...storedParams,
    ...currentParams
  };


  /*
   * ------------------------------------------------------------
   * SALVAR NOVAMENTE
   * ------------------------------------------------------------
   */

  saveStoredData(trackingData);

  saveCookieData(trackingData);


  /*
   * ------------------------------------------------------------
   * MARCAR INFORMAÇÕES DA PRIMEIRA VISITA
   * ------------------------------------------------------------
   */

  if (!trackingData.first_visit_timestamp) {

    trackingData.first_visit_timestamp =
      new Date().toISOString();

  }

  if (!trackingData.first_page_url) {

    trackingData.first_page_url =
      window.location.href;

  }

  if (!trackingData.original_referrer) {

    trackingData.original_referrer =
      document.referrer || '';

  }


  /*
   * Salvar novamente depois dos campos acima.
   */

  saveStoredData(trackingData);

  saveCookieData(trackingData);


  /*
   * ------------------------------------------------------------
   * CONSTRUIR CHECKOUT
   * ------------------------------------------------------------
   */

  function buildCheckoutUrl() {

    const checkoutBase =
      'https://www.checkout-ds24.com/product/680704';

    const checkoutUrl =
      new URL(checkoutBase);


    /*
     * IMPORTANTE:
     *
     * voucher=back2 continua existindo.
     */

    checkoutUrl.searchParams.set(
      'voucher',
      'back2'
    );


    /*
     * Adiciona todos os parâmetros de rastreamento.
     */

    Object.keys(trackingData).forEach(function (key) {

      const value = trackingData[key];

      /*
       * Não mandar objetos vazios.
       */

      if (
        value !== undefined &&
        value !== null &&
        value !== ''
      ) {

        /*
         * Não duplicar voucher.
         */

        if (key !== 'voucher') {

          checkoutUrl.searchParams.set(
            key,
            value
          );
        }
      }

    });


    return checkoutUrl.toString();
  }


  /*
   * ------------------------------------------------------------
   * ATUALIZAR BOTÃO
   * ------------------------------------------------------------
   */

  const checkoutButton =
    document.getElementById('checkout-button');


  if (checkoutButton) {

    checkoutButton.href =
      buildCheckoutUrl();


    /*
     * Antes de sair para o checkout,
     * salva novamente os dados.
     */

    checkoutButton.addEventListener(
      'click',
      function () {

        saveStoredData(trackingData);

        saveCookieData(trackingData);

        /*
         * Recalcula o checkout imediatamente antes
         * da navegação.
         */

        this.href =
          buildCheckoutUrl();

        console.log(
          'Tracking enviado para checkout:',
          this.href
        );
      }
    );
  }


  /*
   * ------------------------------------------------------------
   * DEBUG
   * ------------------------------------------------------------
   *
   * Você pode abrir o console do navegador (F12)
   * para verificar o que foi salvo.
   */

  console.log(
    'Tracking recuperado:',
    trackingData
  );

  console.log(
    'Checkout final:',
    buildCheckoutUrl()
  );

})();
</script>

</body>
</html>
