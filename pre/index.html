<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-150x150.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-150x150.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-300x300.png">
    <meta name="msapplication-TileImage" content="../global_images/favicon-300x300.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; }
        #content-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
    <script src="js/tracking-pixels.js"></script>
</head>
<body>
    <script>
        // Sistema A/B Testing automático com redirecionamento direto
        const params = new URLSearchParams(window.location.search);
        
        // Se não especificado, sorteia entre as variantes disponíveis
        let pressel = params.get('pressel');
        if (!pressel) {
            // Lista das variantes disponíveis (detecta automaticamente)
            const availableVariants = ['pre1v3'];
            pressel = availableVariants[Math.floor(Math.random() * availableVariants.length)];
        }
        
        // Construir URL de destino com parâmetros
        const targetUrl = new URL(`./${pressel}/`, window.location);
        
        // Preservar todos os parâmetros existentes
        params.forEach((value, key) => {
            targetUrl.searchParams.set(key, value);
        });
        
        // Adicionar parâmetros de tracking se não existirem
        if (!params.has('pressel')) {
            targetUrl.searchParams.set('pressel', pressel);
            targetUrl.searchParams.set('utm_source', pressel);
            
            // Atualizar URL principal para mostrar os parâmetros
            const currentUrl = new URL(window.location);
            currentUrl.searchParams.set('pressel', pressel);
            currentUrl.searchParams.set('utm_source', pressel);
            window.history.replaceState({}, '', currentUrl.toString());
        }
        
        // Carregar no iframe ao invés de redirecionar
        const iframe = document.createElement('iframe');
        iframe.id = 'content-frame';
        iframe.src = targetUrl.toString();
        iframe.style.width = '100vw';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        iframe.style.display = 'block';
        
        document.body.appendChild(iframe);
        
        // CONFIGURATION: Google Analytics 4 - Replace GA_MEASUREMENT_ID with your ID
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID'); // CONFIGURE: Your Google Analytics ID here
        
        
    </script><iframe id="content-frame" src="pre1v3.html" style="width: 100vw; height: 100vh; border: none; display: block;"></iframe>
    
    <!-- CONFIGURATION: Google Analytics 4 - Replace GA_MEASUREMENT_ID with your ID -->
    <script async="" src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>

</body></html>
