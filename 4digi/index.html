  <title>Last Step</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Progress bar */
    .progress-wrap {
      margin-bottom: 20px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }
    .progress-bar {
      width: 100%;
      height: 22px;
      background: #e6e6e6;
      border-radius: 12px;
      overflow: hidden;
    }
    .progress-fill {
      width: 99%;
      height: 100%;
      background: linear-gradient(90deg, #1fa83a, #2ecc55);
      background-size: 40px 40px;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.2) 50%, rgba(255,255,255,.2) 75%, transparent 75%, transparent),
        linear-gradient(90deg, #1fa83a, #2ecc55);
      animation: stripes 1s linear infinite;
      border-radius: 12px;
    }
    @keyframes stripes {
      from { background-position: 40px 0, 0 0; }
      to   { background-position: 0 0, 0 0; }
    }

    /* Headline */
    h1 {
      text-align: center;
      font-size: 26px;
      line-height: 1.3;
      margin: 20px 0 25px;
    }
    h1 span { color: #d62828; }

    .watch-text {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #444;
      margin-bottom: 12px;
    }

    /* Video */
    .video-wrap {
      width: 100%;
      margin-bottom: 30px;
    }

    /* Buttons */
    .buttons {
      text-align: center;
    }
    .btn-yes {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 0 auto 18px;
      padding: 20px 15px;
      background: #1fa83a;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      border-radius: 10px;
      box-shadow: 0 0 0 0 rgba(31,168,58,.7);
      animation: pulse 1.5s infinite;
    }
    .btn-yes:hover { background: #1b9333; }

    @keyframes pulse {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(31,168,58,.7); }
      70%  { transform: scale(1.04); box-shadow: 0 0 0 18px rgba(31,168,58,0); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(31,168,58,0); }
    }

    .btn-no {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 14px 15px;
      background: #d62828;
      color: #ffffff;
      font-size: 16px;
      text-decoration: none;
      border-radius: 10px;
    }
    .btn-no:hover { background: #b71f1f; }

    .bottom-space {
      height: 200px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 21px; }
      .btn-yes { font-size: 17px; }
    }
  </style>
</head>
